name: Deploy Pages

# 現在のフロントは Vite/React(src/) をビルドして dist/ を配備する。
# そのため src や build 設定が変わったときに GitHub Pages を再デプロイする。
on:
  push:
    branches:
      - main
      - feature/ai-auto-design-gemini
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'index.html'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Stage static site
        run: |
          mkdir -p _site
          cp -R dist/* _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
